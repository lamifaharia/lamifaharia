<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#070812"/>
    <stop offset="100%" stop-color="#1f1147"/>
  </linearGradient>

  <linearGradient id="building" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#ec4899"/>
  </linearGradient>
</defs>


<!-- Sky -->
<rect width="1000" height="300" fill="url(#background)"/>


<!-- Moon -->
<circle cx="820" cy="70" r="35" fill="#ffffff"/>


<!-- Stars -->
<circle cx="120" cy="60" r="3" fill="white"/>
<circle cx="250" cy="90" r="2" fill="white"/>
<circle cx="430" cy="50" r="3" fill="white"/>
<circle cx="650" cy="80" r="2" fill="white"/>
<circle cx="730" cy="40" r="3" fill="white"/>


<!-- Ground -->
<polygon 
points="0,250 500,170 1000,250 500,300"
fill="#111827"
/>


<!-- Buildings -->

<g fill="url(#building)">

<rect x="100" y="140" width="100" height="110"/>
<polygon points="100,140 150,100 200,140"/>


<rect x="300" y="90" width="130" height="160"/>
<polygon points="300,90 365,40 430,90"/>


<rect x="560" y="130" width="110" height="120"/>
<polygon points="560,130 615,80 670,130"/>


<rect x="780" y="110" width="120" height="140"/>
<polygon points="780,110 840,60 900,110"/>

</g>


<!-- Windows -->

<g fill="#ffffff">

<rect x="130" y="170" width="15" height="15"/>
<rect x="165" y="170" width="15" height="15"/>

<rect x="340" y="130" width="15" height="15"/>
<rect x="390" y="130" width="15" height="15"/>
<rect x="340" y="170" width="15" height="15"/>
<rect x="390" y="170" width="15" height="15"/>

<rect x="590" y="160" width="15" height="15"/>
<rect x="630" y="160" width="15" height="15"/>

<rect x="820" y="150" width="15" height="15"/>
<rect x="860" y="150" width="15" height="15"/>

</g>


<!-- Glow -->
<circle cx="500" cy="150" r="120" fill="#8b5cf6" opacity="0.08"/>


</svg>